name: CNEquity Beijing Data Qualification
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cnequity-bj-probe
  cancel-in-progress: true
jobs:
  cnequity-bj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free CNEquity data lake
        run: pip install "cnequity==0.23.0"
      - name: Probe Beijing Exchange historical bars
        run: |
          mkdir -p output
          cat > output/cnequity-bj.toml <<'EOF'
          extends = "builtin"
          [data]
          root = "${{ github.workspace }}/output/cnequity-bj-lake"
          EOF
          cne init --profile quick --since 2026-05-01 --config output/cnequity-bj.toml
          python scripts/probe_cnequity_bj.py
      - name: Upload CNEquity qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnequity-beijing-data-qualification
          path: output/cnequity_bj_probe.json
          if-no-files-found: warn
          retention-days: 30
