name: CNEquity Bounded Demo Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # The bounded real-provider demo can take a long time and consumes external
    # data-provider quota. Run it only when ingestion/normalization contracts,
    # their tests, dependencies, or this workflow change—not for docs-only PRs.
    paths:
      - "src/providers/cnequity.py"
      - "src/model/data_layer.py"
      - "tests/test_cnequity*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/cnequity-demo.yml"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated A-share symbols (keep this to a small sample)"
        required: true
        default: "600519.SH,000001.SZ,000858.SZ,300750.SZ,601318.SH,600036.SH,000333.SZ,002594.SZ,688981.SH,601899.SH,600000.SH,600900.SH,601166.SH,601088.SH,600276.SH,002415.SZ,002230.SZ,300059.SZ,300760.SZ,688012.SH"
      days:
        description: "Approximate recent trading days"
        required: true
        default: "90"
      include_delisted_history:
        description: "Run the separate, expensive delisted-security coverage audit"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cnequity-demo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rootSunc/CNEquity
          ref: 90ed0a5ad0df455af8d1e2610a79b642956a2f69
          path: cnequity-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FHM and CNEquity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install cnequity
      - name: Prepare resumable delisted-discovery checkpoint
        run: mkdir -p "$RUNNER_TEMP/cnequity-delisted-lake/meta/state"
      - name: Restore delisted-discovery checkpoint
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cnequity-delisted-lake/meta/state/delisted_catalog.json
          key: cnequity-delisted-catalog-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            cnequity-delisted-catalog-${{ github.event.pull_request.head.ref || github.ref_name }}-
      - name: Create isolated real-data lake configuration without hard TDX preflight
        run: |
          set -euo pipefail
          mkdir -p validation/cnequity-demo
          python -c "from importlib.metadata import version; print('cnequity', version('cnequity'))" | tee validation/cnequity-demo/cne-version.txt
          # cne init --profile demo hard-stops when TDX is unreachable, before
          # the normal daily-bar fallback chain can run. Create the config
          # offline, then let the bounded backfill prove which real source works.
          cne config create --config "$RUNNER_TEMP/cnequity-demo.toml" --data-root "$RUNNER_TEMP/cnequity-demo-lake" 2>&1 | tee validation/cnequity-demo/config-create.log
          cne config validate --config "$RUNNER_TEMP/cnequity-demo.toml" 2>&1 | tee validation/cnequity-demo/config-validate.log
          echo "CNE_CONFIG=$RUNNER_TEMP/cnequity-demo.toml" >> "$GITHUB_ENV"
      - name: Ensure bounded demo daily bars exist before downstream derivations
        env:
          DEMO_SYMBOLS: ${{ inputs.symbols || '600519.SH,000001.SZ,000858.SZ,300750.SZ,601318.SH,600036.SH,000333.SZ,002594.SZ,688981.SH,601899.SH,600000.SH,600900.SH,601166.SH,601088.SH,600276.SH,002415.SZ,002230.SZ,300059.SZ,300760.SZ,688012.SH' }}
        run: |
          set -euo pipefail
          # CNEquity deliberately rejects the in-progress A-share daily bar
          # before 15:05 Asia/Shanghai. PRs may run at any hour, so cap the
          # requested range at the previous calendar day until that cutoff.
          LOCAL_HHMM="$(TZ=Asia/Shanghai date +%H%M)"
          if (( 10#$LOCAL_HHMM < 1505 )); then
            BAR_END="$(TZ=Asia/Shanghai date -d 'yesterday' +%F)"
          else
            BAR_END="$(TZ=Asia/Shanghai date +%F)"
          fi
          # Reuse the same Shanghai-local cutoff in downstream history/calendar
          # evidence rather than leaving a stale hard-coded date in the workflow.
          echo "BAR_END=$BAR_END" >> "$GITHUB_ENV"
          # Keep daily bars, corporate actions, and adjustment-factor checks on the same historical window; otherwise older event dates are excluded from factor/action reconciliation.
          BAR_START="$(TZ=Asia/Shanghai date -d '1 year ago' +%F)"
          echo "BAR_START=$BAR_START" >> "$GITHUB_ENV"
          echo "Bounded daily-bar validation window: ${BAR_START}..${BAR_END} (Asia/Shanghai ${LOCAL_HHMM})"
          cne backfill daily_bars --start "$BAR_START" --end "$BAR_END" --symbols "$DEMO_SYMBOLS" --config "$CNE_CONFIG" --plan 2>&1 | tee validation/cnequity-demo/daily-bars-plan.log
          cne backfill daily_bars --start "$BAR_START" --end "$BAR_END" --symbols "$DEMO_SYMBOLS" --config "$CNE_CONFIG" 2>&1 | tee validation/cnequity-demo/daily-bars-backfill.log
          python - <<'PY'
          import os
          from cnequity.query import load

          symbols = [s.strip() for s in os.environ["DEMO_SYMBOLS"].split(",") if s.strip()]
          bars = load("daily_bars", symbols=symbols, adjust=None)
          if hasattr(bars, "to_pandas"):
              bars = bars.to_pandas()
          if bars is None or bars.empty:
              raise RuntimeError("daily_bars prerequisite is still empty after explicit backfill")
          missing = sorted(set(symbols) - set(bars["symbol"].astype(str).unique()))
          if missing:
              raise RuntimeError(f"daily_bars prerequisite missing requested symbols: {missing}")
          print(f"Verified daily_bars prerequisite: {len(bars)} rows across {bars['symbol'].nunique()} symbols")
          PY
      - name: Initialize isolated delisted-history lake
        if: ${{ inputs.include_delisted_history == true }}
        env:
          DEMO_SYMBOLS: ${{ inputs.symbols || '600519.SH,000001.SZ,000858.SZ,300750.SZ,601318.SH,600036.SH,000333.SZ,002594.SZ,688981.SH,601899.SH,600000.SH,600900.SH,601166.SH,601088.SH,600276.SH,002415.SZ,002230.SZ,300059.SZ,300760.SZ,688012.SH' }}
        run: |
          cne init --profile demo --symbols "$DEMO_SYMBOLS" --days 1 --data-root "$RUNNER_TEMP/cnequity-delisted-lake" --config-out "$RUNNER_TEMP/cnequity-delisted.toml" 2>&1 | tee validation/cnequity-demo/delisted-lake-init.log
          echo "DELISTED_CONFIG=$RUNNER_TEMP/cnequity-delisted.toml" >> "$GITHUB_ENV"
      - name: Backfill bounded corporate-action history
        env:
          DEMO_SYMBOLS: ${{ inputs.symbols || '600519.SH,000001.SZ,000858.SZ,300750.SZ,601318.SH,600036.SH,000333.SZ,002594.SZ,688981.SH,601899.SH,600000.SH,600900.SH,601166.SH,601088.SH,600276.SH,002415.SZ,002230.SZ,300059.SZ,300760.SZ,688012.SH' }}
        run: |
          set -euo pipefail
          # The main sample lake feeds the main sample adjustment-factor derivation.
          ACTION_END="$(TZ=Asia/Shanghai date -d 'yesterday' +%F)"
          echo "ACTION_END=$ACTION_END" >> "$GITHUB_ENV"
          export ACTION_END
          cne backfill corporate_actions --start "$BAR_START" --end "$ACTION_END" --symbols "$DEMO_SYMBOLS" --config "$CNE_CONFIG" --plan 2>&1 | tee validation/cnequity-demo/corporate-actions-main-plan.log
          main_attempt=0
          until cne backfill corporate_actions --start "$BAR_START" --end "$ACTION_END" --symbols "$DEMO_SYMBOLS" --config "$CNE_CONFIG" 2>&1 | tee -a validation/cnequity-demo/corporate-actions-main-backfill.log; do
            main_attempt=$((main_attempt + 1))
            if (( main_attempt >= 3 )); then
              echo "Main corporate-action backfill failed after 3 attempts; refusing to continue with incomplete data."
              exit 1
            fi
            echo "Main corporate-action backfill failed; retrying resumable missing chunks (attempt $((main_attempt + 1))/3)."
            sleep $((main_attempt * 10))
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd
          from cnequity.query import load

          symbols = [s.strip() for s in os.environ["DEMO_SYMBOLS"].split(",") if s.strip()]
          actions = load("corporate_actions", symbols=symbols, start=os.environ["BAR_START"],
                         end=os.environ["ACTION_END"])
          if hasattr(actions, "to_pandas"):
              actions = actions.to_pandas()
          required = {"symbol", "ex_date", "action_type", "source"}
          missing = sorted(required - set(actions.columns))
          if missing:
              raise RuntimeError(f"Main sample corporate-action schema missing fields: {missing}")
          if actions.empty:
              raise RuntimeError("No corporate-action rows returned for the bounded main sample")
          if actions.duplicated(["symbol", "ex_date", "action_type"]).any():
              raise RuntimeError("Duplicate main sample corporate-action primary keys")
          if actions[list(required)].isna().any().any():
              raise RuntimeError("Main sample corporate-action identity/source fields contain nulls")
          report = {
              "requested_symbols": sorted(symbols),
              "window": {"start": os.environ["BAR_START"], "end": os.environ["ACTION_END"]},
              "row_count": int(len(actions)),
              "symbols_with_events": sorted(actions["symbol"].astype(str).unique().tolist()),
              "symbols_with_events_count": int(actions["symbol"].nunique()),
              "event_types": sorted(actions["action_type"].astype(str).unique().tolist()),
              "sources": sorted(actions["source"].astype(str).unique().tolist()),
              "ex_date_min": str(pd.to_datetime(actions["ex_date"]).min().date()),
              "ex_date_max": str(pd.to_datetime(actions["ex_date"]).max().date()),
              "historical_pit_eligible": False,
              "note": "Backfilled event history; fetched_at is not proof of historical public availability.",
          }
          Path("validation/cnequity-demo/corporate-actions-main-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Discover confirmed delisted securities (resumable bounded sweep)
        if: ${{ inputs.include_delisted_history == true }}
        run: |
          set -euo pipefail
          # The upstream discovery sweep checkpoints every 100 probes. Keep each Actions run to one checkpointed chunk so it can finish inside the job timeout; later runs resume from the cached catalogue.
          python cnequity-source/scripts/delisted_ops.py --config "$DELISTED_CONFIG" discover --limit 100 2>&1 | tee validation/cnequity-demo/delisted-discovery.log
          cne delisted status --config "$DELISTED_CONFIG" 2>&1 | tee validation/cnequity-demo/delisted-status-before-backfill.log
      - name: Backfill corporate actions for confirmed delisted securities
        if: ${{ inputs.include_delisted_history == true }}
        run: |
          set -euo pipefail
          # Use the confirmed catalog, not today's demo symbols, so recovered
          # delisted bars and their action ledger cover the same securities.
          DELISTED_SYMBOLS="$(python - <<'PY'
          import os
          from cnequity.config import load_config
          from cnequity.quality.delisted_coverage import load_delisted_catalog

          config = load_config(os.environ["DELISTED_CONFIG"])
          print(",".join(sorted(load_delisted_catalog(config))))
          PY
          )"
          test -n "$DELISTED_SYMBOLS"
          export DELISTED_SYMBOLS
          ACTION_END="$(TZ=Asia/Shanghai date -d 'yesterday' +%F)"
          export ACTION_END
          cne backfill corporate_actions --start 1990-01-01 --end "$ACTION_END" --symbols "$DELISTED_SYMBOLS" --config "$DELISTED_CONFIG" --plan 2>&1 | tee validation/cnequity-demo/corporate-actions-delisted-plan.log
          cne backfill corporate_actions --start 1990-01-01 --end "$ACTION_END" --symbols "$DELISTED_SYMBOLS" --config "$DELISTED_CONFIG" 2>&1 | tee validation/cnequity-demo/corporate-actions-delisted-backfill.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd
          from cnequity.config import load_config
          from cnequity.query import load

          symbols = [s for s in os.environ["DELISTED_SYMBOLS"].split(",") if s]
          config = load_config(os.environ["DELISTED_CONFIG"])
          actions = load("corporate_actions", symbols=symbols, start="1990-01-01",
                         end=os.environ["ACTION_END"], config=config)
          if hasattr(actions, "to_pandas"):
              actions = actions.to_pandas()
          required = {"symbol", "ex_date", "action_type", "source"}
          missing = sorted(required - set(actions.columns))
          if missing:
              raise RuntimeError(f"Delisted corporate-action schema missing fields: {missing}")
          if actions.empty:
              raise RuntimeError("No corporate-action rows returned for confirmed delisted securities")
          if actions.duplicated(["symbol", "ex_date", "action_type"]).any():
              raise RuntimeError("Duplicate delisted corporate-action primary keys")
          if actions[list(required)].isna().any().any():
              raise RuntimeError("Delisted corporate-action identity/source fields contain nulls")
          report = {
              "catalog_symbols": sorted(symbols), "catalog_symbol_count": len(symbols),
              "row_count": int(len(actions)), "symbols_with_events": sorted(actions["symbol"].astype(str).unique().tolist()),
              "symbols_with_events_count": int(actions["symbol"].nunique()),
              "event_types": sorted(actions["action_type"].astype(str).unique().tolist()),
              "sources": sorted(actions["source"].astype(str).unique().tolist()),
              "ex_date_min": str(pd.to_datetime(actions["ex_date"]).min().date()),
              "ex_date_max": str(pd.to_datetime(actions["ex_date"]).max().date()),
              "historical_pit_eligible": False,
              "note": "Backfilled event history; fetched_at is not proof of historical public availability.",
          }
          Path("validation/cnequity-demo/corporate-actions-delisted-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Plan and backfill confirmed delisted-security daily bars
        if: ${{ inputs.include_delisted_history == true }}
        run: |
          set -euo pipefail
          cne backfill daily_bars --profile delisted --start 2016-01-01 --config "$DELISTED_CONFIG" --plan 2>&1 | tee validation/cnequity-demo/delisted-bars-plan.log
          cne backfill daily_bars --profile delisted --start 2016-01-01 --config "$DELISTED_CONFIG" 2>&1 | tee validation/cnequity-demo/delisted-bars-backfill.log
          cne delisted status --config "$DELISTED_CONFIG" 2>&1 | tee validation/cnequity-demo/delisted-status-after-backfill.log
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          discovery = Path("validation/cnequity-demo/delisted-discovery.log").read_text(encoding="utf-8")
          log = Path("validation/cnequity-demo/delisted-bars-backfill.log").read_text(encoding="utf-8")
          rows = re.findall(r"(?:Written|rows_written):?\s*([0-9,]+)", log, flags=re.IGNORECASE)
          symbols = re.findall(r"(?:Affected symbols|symbols):?\s*([0-9,]+)", log, flags=re.IGNORECASE)
          report = {
              "profile": "delisted",
              "start": "2016-01-01",
              "end": os.environ["BAR_END"],
              "rows_written_reported": rows[-1].replace(",", "") if rows else None,
              "symbol_count_reported": symbols[-1].replace(",", "") if symbols else None,
              "log_tail": log[-6000:],
              "historical_pit_eligible": False,
              "note": "Historical delisted-security bars are not point-in-time certified merely by backfilling them."
          }
          Path("validation/cnequity-demo/delisted-bars-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({k:v for k,v in report.items() if k != "log_tail"}, ensure_ascii=False, indent=2))
          PY
      - name: Extend trading calendar over recovered delisted history
        if: ${{ inputs.include_delisted_history == true }}
        run: |
          set -euo pipefail
          cne backfill trading_calendar --start 2016-01-01 --end "$BAR_END" --config "$DELISTED_CONFIG" --plan 2>&1 | tee validation/cnequity-demo/trading-calendar-plan.log
          cne backfill trading_calendar --start 2016-01-01 --end "$BAR_END" --config "$DELISTED_CONFIG" 2>&1 | tee validation/cnequity-demo/trading-calendar-backfill.log
      - name: Derive and validate adjustment factors
        env:
          DEMO_SYMBOLS: ${{ inputs.symbols || '600519.SH,000001.SZ,000858.SZ,300750.SZ,601318.SH,600036.SH,000333.SZ,002594.SZ,688981.SH,601899.SH,600000.SH,600900.SH,601166.SH,601088.SH,600276.SH,002415.SZ,002230.SZ,300059.SZ,300760.SZ,688012.SH' }}
        run: |
          cne derive adj_factors --config "$CNE_CONFIG" 2>&1 | tee validation/cnequity-demo/adj-factors.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          from cnequity.query import load

          symbols = [s.strip() for s in os.environ["DEMO_SYMBOLS"].split(",") if s.strip()]
          bars = load("daily_bars", symbols=symbols, adjust=None)
          factors = load("adj_factors", symbols=symbols)
          # CNEquity returns Polars frames; normalize to pandas for the
          # join/coverage report below, while keeping the source query unchanged.
          if hasattr(bars, "to_pandas"):
              bars = bars.to_pandas()
          if factors is not None and hasattr(factors, "to_pandas"):
              factors = factors.to_pandas()
          if factors is None or len(factors) == 0:
              raise RuntimeError("No adjustment factors returned for the demo symbols")
          required = {"symbol", "trade_date", "adjust_type", "factor", "source"}
          missing = sorted(required - set(factors.columns))
          if missing:
              raise RuntimeError(f"Adjustment-factor schema missing fields: {missing}")
          if factors.duplicated(["symbol", "trade_date", "adjust_type"]).any():
              raise RuntimeError("Duplicate adjustment-factor primary keys")
          values = factors["factor"].to_numpy(dtype=float)
          if not np.isfinite(values).all() or (values <= 0).any():
              raise RuntimeError("Adjustment factors contain non-finite or non-positive values")
          hfq = factors[factors["adjust_type"].astype(str).str.lower() == "hfq"].copy()
          if hfq.empty:
              raise RuntimeError("No hfq adjustment factors returned")
          keys = bars[["symbol", "trade_date"]].drop_duplicates()
          matched = keys.merge(hfq[["symbol", "trade_date"]], on=["symbol", "trade_date"], how="left", indicator=True)
          coverage = []
          for symbol in symbols:
              subset = matched[matched["symbol"] == symbol]
              count = int((subset["_merge"] == "both").sum())
              total = int(len(subset))
              coverage.append({"symbol": symbol, "matched_sessions": count, "bar_sessions": total,
                               "coverage": round(count / total, 4) if total else 0.0})
          report = {
              "requested_symbols": sorted(symbols),
              "factor_rows": int(len(factors)),
              "hfq_factor_rows": int(len(hfq)),
              "factor_sources": sorted(factors["source"].astype(str).unique().tolist()),
              "factor_date_min": str(factors["trade_date"].min()),
              "factor_date_max": str(factors["trade_date"].max()),
              "factor_coverage": coverage,
              "all_factors_finite_positive": True,
              "primary_keys_unique": True,
              "historical_pit_eligible": False,
          }
          Path("validation/cnequity-demo/adj-factor-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          low = [x["symbol"] for x in coverage if x["coverage"] < 0.8]
          if low:
              raise RuntimeError(f"Insufficient hfq factor coverage (<80%): {low}")
          adjusted = load("daily_bars", symbols=symbols, adjust="hfq", strict_adj=True)
          if hasattr(adjusted, "to_pandas"):
              adjusted = adjusted.to_pandas()
          if len(adjusted) != len(bars):
              raise RuntimeError(f"Strict hfq row count mismatch: raw={len(bars)}, adjusted={len(adjusted)}")
          if adjusted["close"].isna().any() or not np.isfinite(adjusted["close"].to_numpy(dtype=float)).all():
              raise RuntimeError("Strict hfq adjusted close contains missing/non-finite values")
          Path("validation/cnequity-demo/strict-adjustment-check.json").write_text(
              json.dumps({"raw_rows": int(len(bars)), "strict_hfq_rows": int(len(adjusted)),
                          "strict_hfq_close_finite": True}, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Reconcile corporate-action gaps with independent sources
        env:
          DEMO_SYMBOLS: ${{ inputs.symbols || '600519.SH,000001.SZ,000858.SZ,300750.SZ,601318.SH,600036.SH,000333.SZ,002594.SZ,688981.SH,601899.SH,600000.SH,600900.SH,601166.SH,601088.SH,600276.SH,002415.SZ,002230.SZ,300059.SZ,300760.SZ,688012.SH' }}
        run: |
          set -euo pipefail
          # First compare Sina and Baostock factor steps. Then fill only those
          # missing event rows that Baostock/CNINFO evidence can explain.
          cne derive adj_factor_source --config "$CNE_CONFIG" 2>&1 | tee validation/cnequity-demo/adj-factor-source-audit.log
          # corporate-action-gaps requires factor-arbitration evidence. A clean
          # zero-symbol audit is not evidence that coverage is complete, but it
          # is also not a reason to abort all remaining delisted-history audits.
          # Only plan/apply when the audit actually produced candidate symbols.
          if grep -Eq '"symbols"[[:space:]]*:[[:space:]]*[1-9][0-9]*' validation/cnequity-demo/adj-factor-source-audit.log; then
            cne repair corporate-action-gaps --config "$CNE_CONFIG" 2>&1 | tee validation/cnequity-demo/corporate-action-gaps-plan.log
            cne repair corporate-action-gaps --config "$CNE_CONFIG" --apply 2>&1 | tee validation/cnequity-demo/corporate-action-gaps-apply.log
            echo "applied_or_checked_with_arbitration_evidence" > validation/cnequity-demo/corporate-action-reconciliation-status.txt
          else
            # A completed arbitration with no candidate symbols is a valid
            # no-repair outcome, not proof of complete issuer-event coverage.
            echo "completed_no_candidate_symbols; no_repair_needed; completeness_not_proven" | tee validation/cnequity-demo/corporate-action-reconciliation-status.txt
          fi
          # Recompute after any accepted event changes; do not infer coverage
          # completeness or historical public availability from this repair.
          cne derive adj_factors --config "$CNE_CONFIG" 2>&1 | tee validation/cnequity-demo/adj-factors-after-action-repair.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from cnequity.query import load

          symbols = [s.strip() for s in os.environ["DEMO_SYMBOLS"].split(",") if s.strip()]
          end = os.environ.get("ACTION_END") or os.environ["BAR_END"]
          actions = load("corporate_actions", symbols=symbols, start=os.environ["BAR_START"], end=end)
          factors = load("adj_factors", symbols=symbols)
          if hasattr(actions, "to_pandas"):
              actions = actions.to_pandas()
          if hasattr(factors, "to_pandas"):
              factors = factors.to_pandas()
          required = {"symbol", "ex_date", "action_type", "source"}
          missing = sorted(required - set(actions.columns))
          if missing:
              raise RuntimeError(f"Post-repair corporate-action schema missing: {missing}")
          if actions.duplicated(["symbol", "ex_date", "action_type"]).any():
              raise RuntimeError("Post-repair corporate-action primary keys are not unique")
          report = {
              "requested_symbols": sorted(symbols),
              "window": {"start": os.environ["BAR_START"], "end": end},
              "corporate_action_rows": int(len(actions)),
              "symbols_with_events": int(actions["symbol"].nunique()),
              "event_types": sorted(actions["action_type"].astype(str).unique().tolist()),
              "source_row_counts": {str(k): int(v) for k, v in actions["source"].astype(str).value_counts().to_dict().items()},
              "adjustment_factor_rows_after_repair": int(len(factors)),
              "historical_pit_eligible": False,
              "coverage_status": "not_certified_by_bounded_cross_source_repair",
              "note": "Only evidence-explained gaps are repaired; absence of a gap or successful repair does not prove complete issuer-event coverage or historical public availability."
          }
          Path("validation/cnequity-demo/corporate-action-cross-source-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Derive and validate adjustment factors for recovered delisted history
        if: ${{ inputs.include_delisted_history == true }}
        run: |
          set -euo pipefail
          cne derive adj_factors --config "$DELISTED_CONFIG" 2>&1 | tee validation/cnequity-demo/delisted-adj-factors.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          from cnequity.config import load_config
          from cnequity.query import load

          config = load_config(os.environ["DELISTED_CONFIG"])
          bars = load("daily_bars", adjust=None, config=config)
          factors = load("adj_factors", config=config)
          if hasattr(bars, "to_pandas"):
              bars = bars.to_pandas()
          if hasattr(factors, "to_pandas"):
              factors = factors.to_pandas()
          if bars is None or bars.empty:
              raise RuntimeError("No daily bars in isolated delisted-history lake")
          if factors is None or factors.empty:
              raise RuntimeError("No adjustment factors in isolated delisted-history lake")
          required = {"symbol", "trade_date", "adjust_type", "factor", "source"}
          missing = sorted(required - set(factors.columns))
          if missing:
              raise RuntimeError(f"Delisted adjustment-factor schema missing fields: {missing}")
          if factors.duplicated(["symbol", "trade_date", "adjust_type"]).any():
              raise RuntimeError("Duplicate delisted adjustment-factor primary keys")
          values = factors["factor"].to_numpy(dtype=float)
          if not np.isfinite(values).all() or (values <= 0).any():
              raise RuntimeError("Delisted adjustment factors contain non-finite or non-positive values")
          hfq = factors[factors["adjust_type"].astype(str).str.lower() == "hfq"]
          if hfq.empty:
              raise RuntimeError("No hfq adjustment factors for recovered delisted history")
          keys = bars[["symbol", "trade_date"]].drop_duplicates()
          matched = keys.merge(hfq[["symbol", "trade_date"]], on=["symbol", "trade_date"], how="left", indicator=True)
          coverage = []
          for symbol in sorted(keys["symbol"].astype(str).unique()):
              subset = matched[matched["symbol"].astype(str) == symbol]
              total = int(len(subset))
              count = int((subset["_merge"] == "both").sum())
              coverage.append({
                  "symbol": symbol,
                  "matched_sessions": count,
                  "bar_sessions": total,
                  "coverage": round(count / total, 4) if total else 0.0,
              })
          report = {
              "bar_rows": int(len(bars)),
              "factor_rows": int(len(factors)),
              "hfq_factor_rows": int(len(hfq)),
              "factor_sources": sorted(factors["source"].astype(str).unique().tolist()),
              "factor_coverage": coverage,
              "all_factors_finite_positive": True,
              "primary_keys_unique": True,
              "historical_pit_eligible": False,
              "note": "Recovered historical bars and derived factors are not historical point-in-time certified.",
          }
          Path("validation/cnequity-demo/delisted-adj-factor-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          low = [x["symbol"] for x in coverage if x["coverage"] < 0.8]
          if low:
              raise RuntimeError(f"Insufficient delisted hfq factor coverage (<80%): {low[:50]}")
          adjusted = load("daily_bars", adjust="hfq", strict_adj=True, config=config)
          if hasattr(adjusted, "to_pandas"):
              adjusted = adjusted.to_pandas()
          if len(adjusted) != len(bars):
              raise RuntimeError(f"Delisted strict hfq row count mismatch: raw={len(bars)}, adjusted={len(adjusted)}")
          if adjusted["close"].isna().any() or not np.isfinite(adjusted["close"].to_numpy(dtype=float)).all():
              raise RuntimeError("Delisted strict hfq adjusted close contains missing/non-finite values")
          PY
      - name: Report delisted survivorship coverage (non-gating audit)
        if: ${{ inputs.include_delisted_history == true && success() }}
        run: |
          set +e
          python cnequity-source/scripts/delisted_ops.py --config "$DELISTED_CONFIG" coverage --start 2016-01-01 --end "$BAR_END" --universe all_a_sh_sz > validation/cnequity-demo/delisted-coverage-report.json 2> validation/cnequity-demo/delisted-coverage-report.stderr
          coverage_exit=$?
          set -e
          python - validation/cnequity-demo/delisted-coverage-report.json "$coverage_exit" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              status = {
                  "command_exit_code": exit_code,
                  "verified": bool(report.get("verified", False)),
                  "window": report.get("window"),
                  "universe": report.get("universe"),
                  "counts": report.get("counts", {}),
                  "limitations": report.get("limitations", []),
                  "historical_pit_eligible": False,
              }
          except (OSError, json.JSONDecodeError) as exc:
              status = {
                  "command_exit_code": exit_code,
                  "verified": False,
                  "report_parse_error": str(exc),
                  "historical_pit_eligible": False,
              }
          Path("validation/cnequity-demo/delisted-coverage-status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY
      - name: Capture full CNEquity quality and coverage audit
        if: always()
        run: |
          # This isolated 20-symbol demo lake is not a complete production lake.
          # Preserve the full audit as diagnostic evidence, but do not let unrelated
          # empty all-market datasets block the bounded sample acceptance gate below.
          set +e
          cne audit --full --quality-only 2>&1 | tee validation/cnequity-demo/check.log
          audit_exit=${PIPESTATUS[0]}
          cne status --datasets 2>&1 | tee validation/cnequity-demo/status.log
          status_exit=${PIPESTATUS[0]}
          AUDIT_EXIT="$audit_exit" STATUS_EXIT="$status_exit" python - <<'PY'
          import json, os
          from pathlib import Path
          Path("validation/cnequity-demo/audit-exit-codes.json").write_text(
              json.dumps({
                  "full_quality_audit": True,
                  "quality_audit_is_diagnostic_only": True,
                  "audit_exit_code": int(os.environ["AUDIT_EXIT"]),
                  "status_exit_code": int(os.environ["STATUS_EXIT"]),
                  "bounded_sample_gate": "enforced_in_following_step",
              }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          exit 0
      - name: Validate loaded daily bars and produce bounded evidence report
        env:
          DEMO_SYMBOLS: ${{ inputs.symbols || '600519.SH,000001.SZ,000858.SZ,300750.SZ,601318.SH,600036.SH,000333.SZ,002594.SZ,688981.SH,601899.SH,600000.SH,600900.SH,601166.SH,601088.SH,600276.SH,002415.SZ,002230.SZ,300059.SZ,300760.SZ,688012.SH' }}
          DEMO_DAYS: ${{ inputs.days || '90' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd
          from cnequity.query import load
          from src.providers.cnequity import normalize_daily_bars

          symbols = [s.strip() for s in os.environ["DEMO_SYMBOLS"].split(",") if s.strip()]
          target_sessions = int(os.environ["DEMO_DAYS"])
          raw = load("daily_bars", symbols=symbols, adjust=None)
          # Preserve strict rejection, but capture exact offending source rows so
          # provider null semantics can be diagnosed rather than silently dropped.
          if not isinstance(raw, pd.DataFrame) and hasattr(raw, "to_dicts"):
              raw = pd.DataFrame(raw.to_dicts())
          numeric_cols = ["open", "high", "low", "close", "volume", "amount"]
          numeric = raw[numeric_cols].apply(pd.to_numeric, errors="coerce")
          invalid_mask = numeric.isna().any(axis=1) | ~pd.DataFrame(
              __import__("numpy").isfinite(numeric.to_numpy()),
              index=numeric.index, columns=numeric.columns
          ).all(axis=1)
          invalid_rows = raw.loc[invalid_mask].copy()
          diagnostic = {
              "raw_row_count": int(len(raw)),
              "invalid_row_count": int(len(invalid_rows)),
              "invalid_counts_by_field": {
                  col: int((numeric[col].isna() | ~__import__("numpy").isfinite(numeric[col])).sum())
                  for col in numeric_cols
              },
              "invalid_examples": invalid_rows.head(50).astype(str).to_dict(orient="records"),
              "policy": "No malformed bars are silently dropped; any invalid OHLCVA row blocks validation."
          }
          Path("validation/cnequity-demo/daily-bar-invalid-row-diagnostic.json").write_text(
              json.dumps(diagnostic, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(diagnostic, ensure_ascii=False, indent=2))
          bars = normalize_daily_bars(raw)
          actual_symbols = sorted(bars["symbol"].unique().tolist())
          missing_symbols = sorted(set(symbols) - set(actual_symbols))
          if missing_symbols:
              raise RuntimeError(f"CNEquity returned no daily bars for requested symbols: {missing_symbols}")
          per_symbol = []
          for symbol, group in bars.groupby("symbol", sort=True):
              dates = sorted(group["trade_date"].dt.strftime("%Y-%m-%d").unique().tolist())
              per_symbol.append({
                  "symbol": symbol,
                  "row_count": int(len(group)),
                  "first_trade_date": dates[0],
                  "last_trade_date": dates[-1],
                  "distinct_trade_dates": len(dates),
                  "integer_volume_rows": int((group["volume"] % 1 == 0).sum()),
              })
          report = {
              "requested_symbols": sorted(symbols),
              "target_sessions": target_sessions,
              "minimum_rows_per_symbol": max(1, int(target_sessions * 0.8)),
              "symbols": actual_symbols,
              "missing_symbols": missing_symbols,
              "row_count": int(len(bars)),
              "per_symbol": per_symbol,
              "distinct_trade_dates": int(bars["trade_date"].nunique()),
              "trade_date_min": str(bars["trade_date"].min().date()),
              "trade_date_max": str(bars["trade_date"].max().date()),
              "volume_unit": "shares (CNEquity daily_bars v2 contract)",
              "non_integer_volume_rows": int((bars["volume"] % 1 != 0).sum()),
              "data_versions": sorted(bars["data_version"].astype(str).unique().tolist()),
              "sources": sorted(bars["source"].astype(str).unique().tolist()),
              "fetched_at_min": str(bars["fetched_at"].min()),
              "fetched_at_max": str(bars["fetched_at"].max()),
              "historical_pit_eligible": False,
              "pit_exclusion_reason": "retrieval_time_is_not_historical_availability",
          }
          Path("validation/cnequity-demo/data-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          minimum_rows = max(1, int(target_sessions * 0.8))
          short_symbols = [row["symbol"] for row in per_symbol if row["row_count"] < minimum_rows]
          if short_symbols:
              raise RuntimeError(
                  f"Insufficient daily-bar coverage: fewer than {minimum_rows} rows "
                  f"for requested {target_sessions} sessions: {short_symbols}"
              )
          PY
      - name: Enforce cross-source reconciliation evidence gate
        if: always()
        run: |
          set -euo pipefail
          STATUS_FILE="validation/cnequity-demo/corporate-action-reconciliation-status.txt"
          AUDIT_FILE="validation/cnequity-demo/adj-factor-source-audit.log"
          if [[ ! -s "$STATUS_FILE" || ! -s "$AUDIT_FILE" ]]; then
            echo "Cross-source reconciliation evidence is missing; validation cannot pass."
            exit 1
          fi
          if ! grep -Eq '^(applied_or_checked_with_arbitration_evidence|completed_no_candidate_symbols; no_repair_needed; completeness_not_proven)$' "$STATUS_FILE"; then
            echo "Cross-source reconciliation did not reach a recognized evidence outcome."
            cat "$STATUS_FILE"
            exit 1
          fi
          echo "Cross-source arbitration completed; any no-candidate outcome remains explicitly non-certifying."
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnequity-demo-evidence
          path: validation/cnequity-demo/
          if-no-files-found: warn
          retention-days: 14
