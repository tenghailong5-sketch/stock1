name: Resumable Delisted Security Discovery

on:
  schedule:
    # Daily at 02:00 China time. Each run advances a bounded checkpoint.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delisted-discovery.yml"
  pull_request:
    paths:
      - ".github/workflows/delisted-discovery.yml"

permissions:
  contents: read

concurrency:
  group: delisted-discovery-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/delisted-discovery.yml"); puts "workflow YAML syntax OK"'

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rootSunc/CNEquity
          ref: 90ed0a5ad0df455af8d1e2610a79b642956a2f69
          path: cnequity-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free data pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install cnequity
      - name: Prepare persistent discovery checkpoint
        run: mkdir -p "$RUNNER_TEMP/cnequity-delisted-lake/meta/state"
      - name: Restore latest branch checkpoint (fall back to main)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cnequity-delisted-lake/meta/state/delisted_catalog.json
            ${{ runner.temp }}/cnequity-delisted-lake/meta/quality/evidence/delisted_security_identity/baostock-v1.json
          # A unique key per run is essential: Actions caches are immutable.
          # Restore the newest prior checkpoint, then save the advanced one.
          key: delisted-catalog-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            delisted-catalog-${{ github.event.pull_request.head.ref || github.ref_name }}-
            delisted-catalog-main-
          # Keep completed 750-code checkpoints even if a later step/job fails.
          save-always: true
      - name: Initialize minimal isolated lake
        run: |
          set -euo pipefail
          cne init --profile demo --symbols "600519.SH" --days 1 \
            --data-root "$RUNNER_TEMP/cnequity-delisted-lake" \
            --config-out "$RUNNER_TEMP/cnequity-delisted.toml" \
            2>&1 | tee discovery-init.log
          echo "DELISTED_CONFIG=$RUNNER_TEMP/cnequity-delisted.toml" >> "$GITHUB_ENV"
      - name: Advance resumable discovery checkpoint
        run: |
          set -euo pipefail
          # 750 probes is a bounded daily chunk (~13 minutes at the observed rate),
          # within the 30-minute job limit. Failures remain pending for retry.
          python cnequity-source/scripts/delisted_ops.py \
            --config "$DELISTED_CONFIG" discover --limit 750 \
            > discovery-result.json 2> discovery.log
          cat discovery-result.json
          python - "$DELISTED_CONFIG" discovery-result.json <<'PY'
          import json
          import sys
          from pathlib import Path
          from cnequity.config import load_config
          from cnequity.quality.delisted_coverage import catalog_path
          from cnequity.steps.delisted import pending_codes

          config = load_config(sys.argv[1])
          result = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          path = catalog_path(config)
          catalog = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          delisted = catalog.get("delisted", {})
          never_issued = catalog.get("never_issued", [])
          summary = {
              "probed_this_run": result["probed"],
              "probe_hits_this_run": result["delisted"],
              "never_issued_this_run": result["never_issued"],
              "failed_this_run": result["failed"],
              "remaining_reported": result["remaining"],
              "complete": result["complete"],
              "raw_probe_hits_total": len(delisted),
              "never_issued_total": len(never_issued),
              "pending_recomputed": len(pending_codes(config)),
              "historical_pit_eligible": False,
              "probe_semantics": "A positive Sina history probe is not proof of formal delisting; the Baostock cross-check attempts a separate SH/SZ identity classification when the source is available.",
              "note": "Discovery evidence only; does not certify price-history completeness or point-in-time eligibility.",
          }
          Path("discovery-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Cross-check probe hits against Baostock security master
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          python - "$DELISTED_CONFIG" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          import polars as pl
          from cnequity.adapters.baostock.instruments import fetch_instrument_basics
          from cnequity.config import load_config
          from cnequity.quality.delisted_coverage import catalog_path
          from cnequity.steps.delisted import write_delisted_identity_evidence

          config = load_config(sys.argv[1])
          basics = fetch_instrument_basics(config=config)
          if basics.is_empty():
              raise RuntimeError("Baostock returned an empty security master; refusing to publish identity evidence.")

          stocks = basics.filter(
              (pl.col("asset_type") == "stock")
              & pl.col("exchange").is_in(["SH", "SZ"])
          )
          if stocks.is_empty():
              raise RuntimeError("Baostock returned no SH/SZ stock rows; refusing to publish identity evidence.")

          # The formal delisting identity contract is for A-share stocks.
          # Persist SH/SZ stock rows only; do not let ETF/CDR delistings enter
          # the stock recovery universe. Baostock does not provide BJ coverage.
          identity_path = write_delisted_identity_evidence(config, stocks)
          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          identity["universe_scope"] = "sh_sz_stock"
          identity["asset_type_filter"] = "stock"
          identity_path.write_text(
              json.dumps(identity, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          shutil.copyfile(identity_path, "baostock-identity-evidence.json")
          formal = set(
              stocks.filter(pl.col("delist_date").is_not_null())["symbol"].to_list()
          )
          listed = set(
              stocks.filter(pl.col("delist_date").is_null())["symbol"].to_list()
          )
          catalog_file = catalog_path(config)
          catalog = json.loads(catalog_file.read_text(encoding="utf-8")) if catalog_file.exists() else {}
          probe_hits = set(catalog.get("delisted", {}))
          report = {
              "source": "baostock.query_stock_basic",
              "source_scope": "Baostock-reported SH/SZ stock identity; excludes Beijing listings and does not claim complete all-market coverage.",
              "source_rows_total": basics.height,
              "source_observed_at": identity["observed_at"],
              "identity_evidence_listing_rows": len(identity["listing_dates"]),
              "identity_evidence_formal_delisted_rows": len(identity["delisted_symbols"]),
              "sh_sz_stock_rows": stocks.height,
              "formal_delisted_sh_sz_total": len(formal),
              "currently_listed_sh_sz_total": len(listed),
              "sina_probe_hit_crosscheck": {
                  "raw_probe_hits_total": len(probe_hits),
                  "matched_formal_delisted": len(probe_hits & formal),
                  "matched_currently_listed": len(probe_hits & listed),
                  "not_in_baostock_snapshot": len(probe_hits - formal - listed),
                  "beijing_probe_hits_not_covered": sum(s.endswith(".BJ") for s in probe_hits),
              },
              "identity_evidence_path": str(identity_path),
              "historical_pit_eligible": False,
              "note": "Baostock identity snapshot is a current vendor observation. It is not a historical publication-time record and does not certify daily-bar completeness.",
          }
          Path("baostock-identity-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload discovery checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delisted-discovery-evidence
          path: |
            discovery-init.log
            discovery-result.json
            discovery.log
            discovery-summary.json
            baostock-identity-audit.json
            baostock-identity-evidence.json
          if-no-files-found: warn
          retention-days: 30
