name: FHM-100 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/numeric-factor-validation]
permissions:
  contents: read
concurrency:
  group: fhm100-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |path| begin; YAML.load_file(path); puts "valid YAML: #{path}"; rescue Psych::SyntaxError => e; warn "INVALID YAML: #{path}: line=#{e.line} column=#{e.column} problem=#{e.problem.inspect} context=#{e.context.inspect}"; exit 1; end }'
