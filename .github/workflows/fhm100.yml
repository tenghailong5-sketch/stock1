name: FHM-100 Daily Research
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
concurrency:
  group: fhm100-daily
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run research scan
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # Fast live scan only: historical/PIT enrichment is intentionally excluded.
      # 15m confirmation runs on the ranked shortlist; M8 still requires real account context.
      FHM_HISTORY_SCAN_MAX_SYMBOLS: "off"
      FHM_15M_SCAN_LIMIT: "20"
      FHM_15M_SCAN_WORKERS: "6"
      FHM_CURRENT_SNAPSHOT_MODE: "1"
      FHM_RISK_CONTEXT_JSON: ${{ secrets.FHM_RISK_CONTEXT_JSON }}
        run: python -m src.fhm100
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhm100-report-${{ github.run_number }}
          path: |
            output/
            data/policy_catalysts/discovered_candidates.jsonl
            data/global_news/discovered_candidates.jsonl
          if-no-files-found: warn
          retention-days: 30
