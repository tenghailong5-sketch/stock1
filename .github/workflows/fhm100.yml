name: FHM-100 Daily Research
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
concurrency:
  group: fhm100-daily
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-simple.txt
      - name: Install dependencies
        run: pip install -r requirements-simple.txt
      - name: Run simplified quote scan
        run: python -m src.simple_fhm100
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhm100-report-${{ github.run_number }}
          path: |
            output/
            data/policy_catalysts/discovered_candidates.jsonl
            data/global_news/discovered_candidates.jsonl
          if-no-files-found: warn
          retention-days: 30
