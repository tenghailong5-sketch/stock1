name: FHM-100 Daily Research
on:
  pull_request:
    branches: [main, fix/numeric-factor-validation]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5" # 17:00 Beijing time; run after the 16:30 forward archive
permissions:
  contents: read
concurrency:
  group: fhm100-daily
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      # Pull requests validate code only; do not spend runner time on a live market-data scan.
      # GitHub does not expose repository secrets to fork PRs, and scan output is not a PR check.
      - name: Run research scan
        if: github.event_name != 'pull_request'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python -m src.fhm100
      - name: Upload research report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fhm100-report-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
