name: FHM-100 Daily Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/fhm100.yml"
  schedule:
    - cron: "0 9 * * 1-5" # 17:00 Beijing time; run after the 16:30 forward archive
permissions:
  contents: write
concurrency:
  group: fhm100-daily
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |path| YAML.load_file(path); puts "valid YAML: #{path}" }'
      - name: Run research scan
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python -m src.fhm100
      - name: Commit forward-only stock history archive
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          for archive_path in data/forward_archive/stock_daily data/forward_archive/stock_daily_manifest; do
            if [ -d "$archive_path" ]; then
              git add -A "$archive_path"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive forward-only stock daily history"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Stock history archive pushed successfully."
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying after fetching latest main."
              sleep $((attempt * 3))
            done
            echo "Unable to push stock history archive after 5 attempts."
            exit 1
          else
            echo "No new stock history records."
          fi
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhm100-report-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
