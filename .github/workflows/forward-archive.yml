name: FHM-100 Forward Data Archive

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate providers without writing archive data"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "30 8 * * 1-5" # 16:30 Beijing time; schedule runs from the default branch only
  push:
    branches: [main]
    paths:
      - "src/collectors/forward_archive.py"
      - "src/providers/**"
      - ".github/workflows/forward-archive.yml"

permissions:
  contents: write

concurrency:
  group: fhm100-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated regression tests
        run: pytest -q
      - name: Validate providers without writes
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python -m src.collectors.forward_archive --dry-run
      - name: Capture and archive forward-only snapshots
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: python -m src.collectors.forward_archive --output data/forward_archive
      - name: Commit append-only archive
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forward_archive
          if ! git diff --cached --quiet; then
            git commit -m "Archive forward-only market data"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Market archive pushed successfully."
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying after fetching latest main."
              sleep $((attempt * 3))
            done
            echo "Unable to push market archive after 5 attempts."
            exit 1
          else
            echo "No new archive records."
          fi
