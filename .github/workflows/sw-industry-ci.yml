name: Shenwan Industry Provider CI

on:
  pull_request:
    paths:
      - "src/providers/sw_industry.py"
      - "src/providers/sw_api_industry.py"
      - "src/providers/baidu_industry.py"
      - "src/collectors/forward_archive.py"
      - "tests/test_sw_industry.py"
      - "tests/test_baidu_industry.py"
      - "tests/test_sw_api_industry.py"
      - "tests/test_forward_archive.py"
      - "docs/validated_FHM-100_V2.2-R2.1_完整模型.md"
      - ".github/workflows/sw-industry-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/providers/sw_industry.py"
      - "src/providers/sw_api_industry.py"
      - "tests/test_sw_industry.py"
      - "tests/test_sw_api_industry.py"
      - ".github/workflows/sw-industry-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run industry provider tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_sw_industry.py tests/test_baidu_industry.py tests/test_sw_api_industry.py tests/test_forward_archive.py
