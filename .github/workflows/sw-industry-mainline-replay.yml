name: SW Industry Mainline Historical Replay

on:
  # Data collection and historical replay run only when explicitly requested.
  workflow_dispatch:
concurrency:
  group: sw-mainline-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run focused signal gate tests
        run: pytest -q tests/test_mainline_signal_gates.py tests/test_mainline_validation.py
      - name: Fetch all SW first-level industry histories and replay phases
        run: python scripts/replay_sw_mainlines.py --start-date 20260522 --end-date 20261113
      - name: Audit independent startup, peak and decay evidence
        run: python scripts/audit_mainline_signal_gates.py
      - name: Upload replay and evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-mainline-phase-replay
          path: output/sw_mainline_*
          if-no-files-found: warn
