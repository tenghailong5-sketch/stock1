name: Tencent Resumable Currently-Listed A-Share History Backfill

on:
  # Run only when explicitly requested; checkpoint and release artifacts keep
  # each manually started batch resumable.
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of securities to process in this run (1-200)"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: tencent-full-market-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free data-provider dependencies
        run: python -m pip install "akshare==1.20.37" "pandas>=2.2,<3" "numpy>=1.26,<3"
      - name: Fetch one resumable batch
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
        run: |
          set -euo pipefail
          python scripts/backfill_tencent_history.py --batch-size "$BATCH_SIZE" --start-date 20100101
      - name: Persist batch payload and manifest in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tencent-history-v1"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Tencent A-share historical daily data v1" \
            --notes "Versioned batch archive. Raw unadjusted daily bars retrieved via Tencent/AKShare. Retrieval-time data is not historical point-in-time data." \
            --target "$GITHUB_SHA"
          MANIFEST="$(find output/tencent_history -maxdepth 1 -name 'batch_*.manifest.json' -print -quit)"
          if [ -z "$MANIFEST" ]; then
            echo "No new batch: the universe cursor is exhausted and no retries remain."
            exit 0
          fi
          FILES=("$MANIFEST")
          PAYLOAD="${MANIFEST%.manifest.json}.csv.gz"
          if [ -f "$PAYLOAD" ]; then FILES+=("$PAYLOAD"); fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
      - name: Commit resumable checkpoint to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tencent_history/checkpoint.json
          if git diff --cached --quiet; then
            echo "Checkpoint unchanged; nothing to commit."
          else
            git commit -m "Advance Tencent history backfill checkpoint"
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Checkpoint push attempt ${attempt} failed; retrying."
              sleep $((attempt * 3))
            done
            test "$pushed" -eq 1
          fi
